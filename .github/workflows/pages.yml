name: Publish Varendo documentation

on:
  workflow_run:
    workflows: [Varendo functional quality]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: varendo-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'hermawan22/varendo' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.source.outputs.sha }}
    steps:
      - name: Select verified main source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -Eeuo pipefail
          test "$(gh api "repos/$GH_REPO/branches/main" --jq '.commit.sha')" = "$SOURCE_SHA"
          gh api --method GET "repos/$GH_REPO/actions/workflows/quality.yml/runs" \
            -f head_sha="$SOURCE_SHA" -f branch=main -f event=push -f status=success \
            --jq '.workflow_runs' | jq -e --arg sha "$SOURCE_SHA" \
            'any(.[]; .head_sha == $sha and .conclusion == "success")'
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
      - run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
          pnpm install --frozen-lockfile
          pnpm site:build:pages
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: apps/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        id: deployment
