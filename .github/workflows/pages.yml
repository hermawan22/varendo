name: Publish Varendo documentation

on:
  workflow_run:
    workflows: [Varendo functional quality]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: varendo-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'hermawan22/varendo' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.source.outputs.sha }}
    steps:
      - name: Select verified main source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -Eeuo pipefail
          test "$(gh api "repos/$GH_REPO/branches/main" --jq '.commit.sha')" = "$SOURCE_SHA"
          gh api --method GET "repos/$GH_REPO/actions/workflows/quality.yml/runs" \
            -f head_sha="$SOURCE_SHA" -f branch=main -f event=push -f status=success \
            --jq '.workflow_runs' | jq -e --arg sha "$SOURCE_SHA" \
            'any(.[]; .head_sha == $sha and .conclusion == "success")'
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.24.0 --activate
          pnpm install --frozen-lockfile
      - name: Verify published packages and exported projects
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -Eeuo pipefail
          release_version="$(jq -er '.version | select(type == "string" and test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' release-metadata.json)"
          release_status="$(jq -er '.status | select(. == "candidate" or . == "stable")' release-metadata.json)"
          if [ "$release_status" = candidate ]; then exit 0; fi
          mkdir -p artifacts/pages-release-policy
          node --experimental-strip-types scripts/release/verify-export-registry.mjs \
            --version "$release_version" --source "$SOURCE_SHA" \
            --output artifacts/pages-release-policy/export-consumer.json
          printf 'AELIQO_EXPORT_VERIFIED_VERSION=%s\n' "$release_version" >> "$GITHUB_ENV"
      - name: Build Pages
        run: pnpm site:build:pages
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: apps/site/dist
      - name: Preserve export verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: varendo-pages-export-${{ steps.source.outputs.sha }}
          path: artifacts/pages-release-policy/export-consumer.json
          if-no-files-found: ignore
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        id: deployment
