<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Varendo vNext presentation evidence</title>
    <style>
      :root {
        color-scheme: light;
        font:
          16px/1.4 system-ui,
          sans-serif;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-inline-size: 0;
        padding: 2rem;
        background: #f6f7f9;
        color: #1e293b;
      }
      main {
        display: grid;
        gap: 1.5rem;
        grid-template-columns: minmax(0, 1fr);
        inline-size: 100%;
        max-width: 72rem;
        margin: 0 auto;
        min-inline-size: 0;
      }
      section {
        min-inline-size: 0;
        padding: 1rem;
        background: white;
        border: 1px solid #dbe2ea;
        border-radius: 0.75rem;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin: 0.75rem 0;
      }
      button {
        min-block-size: 2.75rem;
        padding: 0.4rem 0.7rem;
      }
      select {
        min-block-size: 2.75rem;
        max-inline-size: 100%;
      }
      button:focus-visible,
      select:focus-visible,
      input:focus-visible {
        outline: 0.1875rem solid #4338ca;
        outline-offset: 0.125rem;
      }
      [data-region-host] {
        width: 800px;
        max-width: 100%;
        min-inline-size: 0;
        min-height: 12rem;
        resize: horizontal;
        overflow: auto;
        border: 1px dashed #94a3b8;
      }
      aeliqo-region {
        display: block;
        min-height: 10rem;
      }
      [data-draft] {
        margin: 0.75rem;
        padding: 0.4rem;
      }
      [data-view-root] {
        display: grid;
        gap: 0.75rem;
      }
      [role='status'],
      [role='alert'] {
        overflow-wrap: anywhere;
      }
      h1,
      h2 {
        overflow-wrap: anywhere;
      }
      [data-clarification] {
        display: grid;
        gap: 0.5rem;
        margin-block: 0.75rem;
        max-inline-size: 42rem;
      }
      [data-clarification][hidden] {
        display: none;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Presentation evidence</h1>
      <p id="page-status" role="status">Loading…</p>

      <section aria-labelledby="people-heading">
        <h2 id="people-heading">People browse</h2>
        <div class="controls">
          <button type="button" data-action="people-adaptive">Adaptive</button>
          <button type="button" data-action="people-jakarta">People in Jakarta</button>
          <button type="button" data-action="people-table">Table</button>
          <button type="button" data-action="people-cards">Cards</button>
          <button type="button" data-action="people-partial">Show partial page</button>
          <button type="button" data-action="people-start-cancellable">Start cancellable update</button>
          <button type="button" data-action="people-cancel" disabled>Cancel update</button>
          <button type="button" data-action="people-invalid">Unsupported request</button>
          <button type="button" data-action="people-denied">Revoke access</button>
        </div>
        <p id="people-status" role="status" aria-atomic="true">Idle</p>
        <p id="people-filter">All authorized people · scope vnext-scope</p>
        <div id="people-host" data-region-host role="region" aria-label="People presentation">
          <input id="people-draft" data-dirty="true" aria-label="Draft note" placeholder="Draft note" />
        </div>
      </section>

      <section aria-labelledby="analysis-heading">
        <h2 id="analysis-heading">Workforce analysis</h2>
        <div class="controls">
          <button type="button" data-action="analysis-bar">Bar</button>
          <button type="button" data-action="analysis-trend">Trend</button>
          <button type="button" data-action="analysis-clarify">Trend with two measures</button>
        </div>
        <p id="analysis-status" role="status" aria-atomic="true">Idle</p>
        <div id="analysis-clarification" data-clarification hidden aria-labelledby="analysis-status">
          <label for="analysis-measure">Measure for trend</label>
          <select id="analysis-measure">
            <option value="month-headcount">Month end headcount</option>
            <option value="planned-headcount">Planned headcount</option>
          </select>
          <button type="button" data-action="analysis-apply-clarification">Show selected measure</button>
        </div>
        <div id="analysis-host" data-region-host role="region" aria-label="Analysis presentation"></div>
      </section>

      <section aria-labelledby="compare-heading">
        <h2 id="compare-heading">Comparison</h2>
        <div class="controls">
          <button type="button" data-action="compare">Compare</button>
        </div>
        <p id="compare-status" role="status" aria-atomic="true">Idle</p>
        <div id="compare-host" data-region-host role="region" aria-label="Comparison presentation"></div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
