<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'nonce-t02nonce'; connect-src 'self' ws:; object-src 'none'; base-uri 'none'"
    />
    <title>Varendo platform fixture</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main id="standalone-root">
      <h1>Vanilla platform fixture</h1>
      <p id="standalone-status" role="status">Ready.</p>
      <form id="standalone-form">
        <fieldset id="standalone-fieldset">
          <aeliqo-text-field
            label="Name"
            value="Ada"
            default-value="Ada"
            name="person"
            required
            description="The value is controlled by the host."
          ></aeliqo-text-field>
        </fieldset>
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
      </form>
      <aeliqo-table id="standalone-table"></aeliqo-table>
      <aeliqo-chart id="standalone-chart"></aeliqo-chart>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
